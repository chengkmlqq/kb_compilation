# Alembic configuration — KB Compilation framework store.
#
# Only the FRAMEWORK store (DATABASE_URL, currently MySQL kb_frame) is managed
# here — its 47 Base.metadata tables are where schema drift actually bites.
# The vector store (KNOWLEDGE_DATABASE_URL, PG + pgvector) keeps its existing
# DDL path: alembic autogenerate cannot express the HNSW index on kb_embedding,
# and that single table is created by scripts/knowledge_schema.sql on a fresh
# data volume (docker-entrypoint-initdb.d).
#
# URL is resolved at runtime in migrations/env.py from api.config (env vars /
# .env) — never hardcode credentials here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S