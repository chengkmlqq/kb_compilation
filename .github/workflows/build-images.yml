# build-images.yml — 构建并推送 kb_compilation 的镜像
#
# 风格对照 agent-gateway 工程的 build-agent-gateway.yml：
#   buildx 多平台 + 登录 registry + docker/build-push-action + GHA 层缓存 +
#   registry/namespace 可用仓库变量 vars.REGISTRY / vars.REGISTRY_NAMESPACE 覆盖。
#
# 本仓库产出三个镜像：
#   - kb-api-server : deploy/Dockerfile.api-server，构建上下文 = 仓库根（FastAPI，不含 Celery）
#   - kb-worker     : deploy/Dockerfile.worker，构建上下文 = 仓库根（Celery worker/beat/flower 共用）
#   - kb-agent-worker: deploy/Dockerfile.agent-worker，构建上下文 = 仓库根
#                     （wiki 构建的内联 agent 运行时，= kb-worker + openai-agents SDK）
#   - kb-web        : deploy/Dockerfile.web，构建上下文 = web/（Next.js / bun）

name: kb_compilation 镜像构建

# 只保留手工触发（workflow_dispatch）：push 到 main 不自动构建镜像，
# 避免频繁 push 抢占 runner / 覆盖 latest 镜像。需要构建时在 Actions 页
# 手动点 "Run workflow"。
on:
  workflow_dispatch:

concurrency:
  group: kb-compile-images
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ck-registry' }}

jobs:
  # ------------------------------------------------------------- api-server 镜像
  build-api-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/kb-api-server" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 kb-api-server 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api-server
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            PY_BASE_IMAGE=${{ vars.PY_BASE_IMAGE || 'python:3.11-slim' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=kb-api-server
          cache-to: type=gha,mode=max,scope=kb-api-server

  # ------------------------------------------------------------- worker 镜像
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/kb-worker" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 kb-worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            PY_BASE_IMAGE=${{ vars.PY_BASE_IMAGE || 'python:3.11-slim' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=kb-worker
          cache-to: type=gha,mode=max,scope=kb-worker

  # --------------------------------------------- agent worker 镜像（wiki 构建）
  build-agent-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/kb-agent-worker" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 kb-agent-worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.agent-worker
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            PY_BASE_IMAGE=${{ vars.PY_BASE_IMAGE || 'python:3.11-slim' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=kb-agent-worker
          cache-to: type=gha,mode=max,scope=kb-agent-worker

  # ------------------------------------------------------------- web 镜像
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/kb-web" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 kb-web 镜像
        uses: docker/build-push-action@v7
        with:
          context: web
          file: deploy/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=kb-web
          cache-to: type=gha,mode=max,scope=kb-web
