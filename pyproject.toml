[project]
name = "kb-api"
version = "0.1.0"
description = "KB wiki platform: framework layer migrated from the legacy data-synthesis platform + WeKnora RAG capabilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.3",
    "celery>=5.4",
    "flower>=2.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "neo4j>=5.20",
    "pgvector>=0.2",
    "pycryptodome>=3.23.0",
    "minio>=7.2.20",
    "croniter>=6.2.4",
    "beautifulsoup4>=4.14",
    "ebooklib>=0.18",
    "lxml>=6.1",
    "markdownify>=0.13",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pillow>=12.2",
    "pypdf>=6.13",
    "python-docx>=1.2",
    "requests>=2.33",
    "markitdown[docx,pdf,xls,xlsx]>=0.1.3",
    "playwright>=1.55",
    "trafilatura>=2.0",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
