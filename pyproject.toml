[project]
name = "kb-api"
version = "0.1.0"
description = "KB compilation platform: framework layer extracted from data-synth + WeKnora RAG capabilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery>=5.4",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "neo4j>=5.20",
    "pgvector>=0.2",
    "pycryptodome>=3.23.0",
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
