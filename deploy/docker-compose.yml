# KB Compilation Platform — docker-compose 部署
#
# 组件：
#   nginx          统一入口（:80），转发到 web
#   web            Next.js 16 前端（:3000，standalone），内部代理 /api/* 到 api-server
#   api-server     FastAPI（:8000），23 端点
#   celery-worker  Celery 任务 worker（文档解析/向量化/wiki/图谱）
#   celery-beat    Celery beat（扫描 modo_cron_task）
#   redis          Celery broker + result backend
#   pg             PostgreSQL + pgvector（知识库存储）
#   mysql          框架库（用户/角色/菜单/数据源/调度/日志）
#
# 使用（全部配置在 deploy/.env，无凭据字面量）：
#   cd deploy && cp .env.example .env   # 填好凭据
#   docker compose up -d --build
#   访问 http://<host>:80
#
# 注意：变量插值与 env_file 都读 deploy/.env（docker compose 读 -f 同目录的 .env）。

name: kb-compilation

x-api-env: &api-env
  env_file:
    - .env
  environment:
    DB_TYPE: mysql
    REDIS_URL: ${KB_REDIS_URL}
    CELERY_BROKER_URL: ${KB_CELERY_BROKER_URL}
    CELERY_RESULT_BACKEND: ${KB_CELERY_RESULT_BACKEND}
    KNOWLEDGE_DATABASE_URL: ${KB_KNOWLEDGE_DATABASE_URL}
    KB_STORAGE_DIR: /data/kb_documents

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kb-net

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: kb-web
    restart: unless-stopped
    environment:
      # 容器内经代理链路：浏览器只连 nginx，所有 /api/* 由 web 代发到 api-server
      API_BASE_URL: ${KB_API_INTERNAL_URL}
    depends_on:
      - api-server
    networks:
      - kb-net

  api-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: kb-api-server
    restart: unless-stopped
    <<: *api-env
    volumes:
      - kb-docs:/data/kb_documents
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  celery-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: kb-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    <<: *api-env
    volumes:
      - kb-docs:/data/kb_documents
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: kb-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    <<: *api-env
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  flower:
    # Celery worker 监控（任务队列/执行状态/失败重试），经 nginx /flower/ 访问
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: kb-flower
    restart: unless-stopped
    command:
      - sh
      - -lc
      - 'celery -A worker.celery_app flower --address=0.0.0.0 --port=5555 --persistent=False --basic_auth="$${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH is required}"'
    <<: *api-env
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    depends_on:
      redis:
        condition: service_started
    networks:
      - kb-net

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - kb-net

  pg:
    image: pgvector/pgvector:pg17
    container_name: kb-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动应用知识库 DDL（幂等）
      - ../scripts/knowledge_schema.sql:/docker-entrypoint-initdb.d/01-knowledge-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kb-net

  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动应用知识库业务表 DDL（幂等；框架 modo_* 表仍需手动建表+种子）
      - ../scripts/knowledge_business_schema.sql:/docker-entrypoint-initdb.d/01-knowledge-business-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kb-net

volumes:
  pg-data:
  mysql-data:
  redis-data:
  kb-docs:

networks:
  kb-net:
    driver: bridge