# KB Compilation Platform — docker-compose 部署
#
# 组件：
#   nginx          统一入口（:80），转发到 web
#   web            Next.js 16 前端（:3000，standalone），内部代理 /api/* 到 api-server
#   api-server     FastAPI（:8000），23 端点
#   celery-worker  Celery 任务 worker（文档解析/向量化/wiki/图谱）
#   celery-beat    Celery beat（扫描 modo_cron_task）
#   redis          Celery broker + result backend
#   pg             PostgreSQL + pgvector（知识库存储）
#   mysql          框架库（用户/角色/菜单/数据源/调度/日志）
#
# 使用（全部配置在 deploy/.env，无凭据字面量）：
#   cd deploy && cp .env.example .env   # 填好凭据
#   docker compose up -d --build
#   访问 http://<host>:80
#
# 注意：变量插值与 env_file 都读 deploy/.env（docker compose 读 -f 同目录的 .env）。

name: kb-compilation

x-api-env: &api-env
  env_file:
    - .env
  environment:
    DB_TYPE: mysql
    DATABASE_URL: ${KB_DATABASE_URL}
    REDIS_URL: ${KB_REDIS_URL}
    CELERY_BROKER_URL: ${KB_CELERY_BROKER_URL}
    CELERY_RESULT_BACKEND: ${KB_CELERY_RESULT_BACKEND}
    KNOWLEDGE_DATABASE_URL: ${KB_KNOWLEDGE_DATABASE_URL}
    KB_STORAGE_DIR: /data/kb_documents
    # agent-gateway (host-bound :8080). The worker reaches it through
    # host.docker.internal (see celery-worker extra_hosts).
    AGENT_GATEWAY_BASE_URL: ${AGENT_GATEWAY_BASE_URL:-http://host.docker.internal:8080}
    AGENT_GATEWAY_ADMIN_TOKEN: ${AGENT_GATEWAY_ADMIN_TOKEN:-}
    AGENT_GATEWAY_TIMEOUT_S: ${AGENT_GATEWAY_TIMEOUT_S:-3600}
    AGENT_GATEWAY_POLL_INTERVAL_S: ${AGENT_GATEWAY_POLL_INTERVAL_S:-15}
    # MinIO 对象存储（api-server / worker 均经 kb-net 访问 minio:9000）
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-kbminioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    MINIO_SECURE: ${MINIO_SECURE:-false}
    MINIO_BUCKET: ${MINIO_BUCKET:-kb-compilation}
    # Neo4j 知识图谱（worker KbGraphBuildTask 写入，api-server graph 查询路由读取）
    NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kb_neo4j_pass}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    # 文档解析服务（MinerU 4.0.9 CPU 推理 / PaddleOCR-VL）：
    # parser_registry.mineru_endpoint() / paddle_endpoint() 直接读这两个 env，
    # 缺失时 PDF/OCR 解析会判定引擎不可用。缺省走 kb-net 服务名。
    MINERU_ENDPOINT: ${MINERU_ENDPOINT:-http://mineru:8000}
    PADDLEOCR_ENDPOINT: ${PADDLEOCR_ENDPOINT:-http://paddleocr:8081}
    # 置 1 表示 PaddleOCR-VL 真实模型已就绪（当前为占位服务，保持 0）
    PADDLEOCR_VL_READY: ${PADDLEOCR_VL_READY:-0}

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kb-net

  web:
    image: ${REGISTRY:-crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com}/ck-registry/kb-web:${KB_IMAGE_TAG:-latest}
    container_name: kb-web
    restart: unless-stopped
    environment:
      # 容器内经代理链路：浏览器只连 nginx，所有 /api/* 由 web 代发到 api-server
      API_BASE_URL: ${KB_API_INTERNAL_URL}
    depends_on:
      - api-server
    networks:
      - kb-net

  api-server:
    image: ${REGISTRY:-crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com}/ck-registry/kb-api-server:${KB_IMAGE_TAG:-latest}
    container_name: kb-api-server
    restart: unless-stopped
    <<: *api-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kb-docs:/data/kb_documents
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  celery-worker:
    image: ${REGISTRY:-crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com}/ck-registry/kb-worker:${KB_IMAGE_TAG:-latest}
    container_name: kb-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "default"]
    <<: *api-env
    extra_hosts:
      # Linux has no automatic host.docker.internal; map it so the worker
      # can reach the host-bound agent-gateway (:8080). No-op on Docker Desktop.
      - "host.docker.internal:host-gateway"
    volumes:
      - kb-docs:/data/kb_documents
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  celery-beat:
    image: ${REGISTRY:-crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com}/ck-registry/kb-worker:${KB_IMAGE_TAG:-latest}
    container_name: kb-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    <<: *api-env
    depends_on:
      redis:
        condition: service_started
      pg:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - kb-net

  flower:
    # Celery worker 监控（任务队列/执行状态/失败重试），经 nginx /flower/ 访问
    image: ${REGISTRY:-crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com}/ck-registry/kb-worker:${KB_IMAGE_TAG:-latest}
    container_name: kb-flower
    restart: unless-stopped
    command:
      - celery
      - -A
      - worker.celery_app
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --persistent=False
      - --basic_auth=${FLOWER_BASIC_AUTH}
    <<: *api-env
    environment:
      # 注意：显式 environment 键会整体覆盖 anchor 的 environment（YAML merge
      # 是浅合并），所以 broker/backend 必须在此重列，否则 flower 拿不到
      # CELERY_BROKER_URL → 回退 localhost → worker 全部离线（Connection refused）。
      CELERY_BROKER_URL: ${KB_CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${KB_CELERY_RESULT_BACKEND}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    depends_on:
      redis:
        condition: service_started
    networks:
      - kb-net

  # ── 文档解析服务（解析引擎规则 engine=mineru / paddleocr_vl 的落点）────
  # 说明见 deploy/README-parsers.md
  mineru:
    # 官方 mineruorg/mineru 镜像被本网络 Docker Hub 白名单拦截，故自建：
    # python:3.11-slim + 官方包 mineru==4.0.9，入口为官方 FastAPI 服务 mineru-api。
    # CPU 推理路径（onnxruntime + llama.cpp），不装 torch。
    build:
      context: ./parsers/mineru_service
    image: ${MINERU_IMAGE:-kb-mineru:local}
    container_name: kb-mineru
    restart: unless-stopped
    command:
      # 入口 = 官方 create_app + /file_parse 契约端点（server_shim.app）
      - uvicorn
      - server_shim:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      # HF 直连不可达，权重走 hf-mirror 镜像下载
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      MINERU_ENDPOINT: ${MINERU_ENDPOINT:-http://mineru:8000}
    volumes:
      # 模型权重约 2.1GB（ONNX 小模型 + GGUF VLM），与镜像分离、可单独清理。
      # 注意路径是 /root/.mineru（mineru 自建目录），不是 /root/.cache/huggingface
      # —— 实测权重落在 /root/.mineru/models 下，挂错路径会导致每次重建容器重下 2GB。
      - mineru-models:/root/.mineru
    ports:
      # 宿主端口 18000，避开 80/5432/6379/3306 等常用端口
      - "${MINERU_HOST_PORT:-18000}:8000"
    healthcheck:
      # 官方 v1 API 的健康端点。--preload-models 下，200 即代表权重已就绪、
      # 可真正解析。首次启动要下约 2.1GB 权重（本机实测约 400KB/s，约 70 分钟），
      # 故 start_period 放宽到 1 小时，避免下载期间被判 unhealthy。
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 3600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kb-net

  paddleocr:
    # PaddleOCR-VL 解析服务。当前为 HTTP 占位实现（app.py）：接口契约与官方
    # PaddleOCR-VL serving 一致，端点可配置/可探测，解析请求返回 503 + 安装指引。
    # 真实模型在本机不可行（无 GPU + 权重 2.1GB + 磁盘紧张），装法见 README-parsers.md。
    build:
      context: ./parsers/paddle_service
    image: ${PADDLEOCR_IMAGE:-kb-paddleocr:local}
    container_name: kb-paddleocr
    restart: unless-stopped
    environment:
      PADDLEOCR_ENDPOINT: ${PADDLEOCR_ENDPOINT:-http://paddleocr:8081}
      # 设为 1 表示真实模型已就绪（当前未装，保持 0）
      PADDLEOCR_VL_READY: ${PADDLEOCR_VL_READY:-0}
    ports:
      # 宿主端口 18081，避开常用端口
      - "${PADDLEOCR_HOST_PORT:-18081}:8081"
    healthcheck:
      # /health 恒 200（服务存活）；模型可用性看响应体 model_available
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kb-net

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - kb-net

  pg:
    image: pgvector/pgvector:pg17
    container_name: kb-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动应用知识库 DDL（幂等）
      - ../scripts/knowledge_schema.sql:/docker-entrypoint-initdb.d/01-knowledge-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kb-net

  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动应用知识库业务表 DDL（幂等；框架 modo_* 表仍需手动建表+种子）
      - ../scripts/knowledge_business_schema.sql:/docker-entrypoint-initdb.d/01-knowledge-business-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kb-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: kb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kbminioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必填（deploy/.env）}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  neo4j:
    # 知识图谱存储（实体/关系）。写入见 api/services/graph.py Neo4jGraphStore
    # （worker KbGraphBuildTask 调用），查询见 api/routers/graph.py。
    # 独立实例，与 WeKnora-neo4j 完全隔离（不同 compose 项目、数据卷、密码）。
    image: neo4j:2025.10.1
    container_name: kb-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-kb_neo4j_pass}
      # apoc：与 WeKnora 一致开启（MERGE/检索插件）
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # 内存：本机与 WeKnora-neo4j 共存且内存紧张，heap 1G / pagecache 512M（约 1.5G 实测占用）。
      # 官方默认 512M 过小会导致启动慢/频繁 GC。
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP:-1G}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512M}
    volumes:
      - neo4j-data:/data
    ports:
      # Browser 17474 / Bolt 17687 —— 避开 WeKnora-neo4j 已占用的 7474/7687
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-kb_neo4j_pass} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kb-net

volumes:
  pg-data:
  mysql-data:
  redis-data:
  kb-docs:
  minio-data:
  # MinerU 模型权重（ONNX 小模型 + GGUF VLM，约 2.1GB）
  mineru-models:
  # Neo4j 知识图谱数据
  neo4j-data:

networks:
  kb-net:
    driver: bridge