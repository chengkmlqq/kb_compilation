# =============================================================
# KB Compilation Platform — nginx 统一入口
# 应用整体挂载在 /wiki 前缀（Next.js basePath），根路径不再代理应用；
# /api 由 nginx 直连 api-server（不再经 web 中间跳板），SSE 关缓冲。
# =============================================================

# 文档上传允许 50MB（默认 nginx 1MB，制度 PDF 会超限返 413）
client_max_body_size 50m;

upstream web_backend {
    server web:3000;
}

upstream api_backend {
    server api-server:8000;
}

upstream flower_backend {
    server flower:5555;
}

server {
    listen 80;
    server_name _;

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── API：nginx 直连 api-server（含 SSE 流式，关缓冲）──
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ── 应用（Next.js web）：统一 /wiki 前缀（basePath）──
    location /wiki {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ── 根路径：不再被应用占用，引导到 /wiki ──
    location = / {
        return 302 /wiki/;
    }
    location / {
        return 404;
    }

    # Flower UI (Celery worker 监控)
    location /flower/ {
        proxy_pass http://flower_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
